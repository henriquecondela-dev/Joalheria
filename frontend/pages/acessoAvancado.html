<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/global.css">
   <link rel="stylesheet" href="/frontend/css/acessoAvancado.css">
    <title>Joalheria Zambeze</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-esq">
                <button id="menu-button">
                    <img class="icon-menu activo" id="abrir-menu"  src="/icons/menu-burger.png" alt="abrir">
                    <img class="icon-menu" id="fechar-menu" src="/icons/close.png" alt="fechar">
                </button>
                <h1 class="logo">JOALHERIA</h1>
            </div>
            <div class="nav-dir">
                <a  href="/frontend/pages/credenciar.html">
                    <img title="Registar"  class="icon" src="/icons/user.png" alt="usuario">
                </a>
                <a href="/frontend/pages/inicial.html">
                    <img title="Explorar Produtos" class="icon" src="/icons/shopping-bag.png"  alt="carteira">
                </a>
                <a href="/frontend/pages/carrinho.html">
                    <img title="O Meu Carinho" class="icon" src="/icons/shopping-cart.png" alt="">
                </a>
            </div>
        </nav>
    </header> 
      <div class="mensagem-Erro"></div>
          <div class="menu">
        <div >
            <a class="explorarProdutos" href="/frontend/pages/inicial.html">EXPLORAR PRODUTOS</a>
        </div>
        <div class="departamentos">
            <h4>DEPARTAMENTOS</h4>
            <a id="dpRelogios" href="/frontend/pages/departamento.html#relogios">Relogios</a>
            <a id="dpAneis" href="/frontend/pages/departamento.html#aneis">Aneis</a>
            <a id="dpPulseiras" href="/frontend/pages/departamento.html#pulseiras">Puleiras</a>
            <a id="dpPegas" href="/frontend/pages/departamento.html#pegas">Pegas</a>
            <a id="dpBrincos" href="/frontend/pages/departamento.html#brincos">Brincos</a>
            <a id="dpColares" href="/frontend/pages/departamento.html#colares">Colares</a>
        </div>
        <div>
            <a class="acessoAvancado" href="/frontend/pages/acessoAvancado.html">Acesso Avancado</a>
        </div>
        <div>   
            <button type="button" id="logout" class="logout">
                <img src="/icons/exit (1).png" class="icon" alt="terminar sessao" title="Terminar sessao"></button>
        </div>
    </div>
    <div class="ladoAdm">
        <form class="admin-form" >
            <h1>ACESSO DE ADMINISTRADOR</h1>
            <label for="admin-email">Email:</label>
            <input type="email" name="admin-email" id="admin-email" placeholder="guambe@gmail.com" required>

            <label for="admin-senha">Senha:</label>
            <input class="senha-input" type="password" name="admin-senha" id="admin-senha" placeholder="*********" required >

            <button id="admin-login" type="submit">Entrar</button>
        </form>
              
    </div>
    <div class="ladoVendedor">
        <form class="vendedor-form" >
        <h1>ACESSO DE VENDEDOR</h1>
            <label for="vendedor-email">Email:</label>
            <input type="email" name="vendedor-email" id="vendedor-email" placeholder="guambe@gmail.com" required>

            <label for="vendedor-senha">Senha:</label>
            <input class="senha-input" type="password" name="vendedor-senha" id="vendedor-senha" placeholder="*********" required >

            <button id="vendedor-login" type="submit">Entrar</button>
        </form>
    </div>
    <div class="ladoCadastrar">
           <form class="cadastrarvendedor-form" >
                <h1>TORNAR-SE VENDEDOR</h1>
                
                <label for="cadastrarvendedor-email">Email<sup>*</sup>:</label>
                <input type="email" name="vendedor-email" id="cadastrarvendedor-email" placeholder="guambe@gmail.com" required>

                <label for="nome">Numero de cartao de credito<sup>*</sup>:</label>
                <input type="text" id="numeroDoCartao" required>

                <label for="departamento">Departamento<sup>*</sup>:</label>
                <select name="departamneto" id="departamento">
                    <option value="">Selecione o Departamento</option>
                    <option value="4">Relogio</option>
                    <option value="3">Aneis</option>
                    <option value="1">Colares</option>
                    <option value="2">Pulseiras</option>
                    <option value="5">Brincos</option>
                    <option value="6">Pegas</option>
                </select>
                <button id="cadastrovendedor-login" type="submit">Submeter Candidatura</button>
            </form>
    </div>
    <main>
      <button id="entrarAdm" type="button" class="button">ENTRAR COMO ADMINISTRADOR</button>
      <button id="entrarVendedor" type="button" class="button">ENTRAR COMO VENDEDOR</button>
        <a href="#cadastarVendedor" >Deseja se tornar um vendedor?</a>
        
      <button id="cadastrarVendedor" type="button" class="button">CADASTRAR A VENDEDOR</button>
    </main>
   
    <script src="/frontend/js/menu.js"></script>
    <script type="module" src="/frontend/js/acessoAvancado.js"></script>
</body>
</html>
