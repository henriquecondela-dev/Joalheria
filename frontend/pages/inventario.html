
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/vendedor.css">
    <link rel="stylesheet" href="/frontend/css/inventario.css">

    <title>Inventário - Joalheria Zambeze</title>
</head>

<body>

    <header>
        <nav>
            <div class="nav-esq">
                <button id="menu-button" type="button">
                    <img
                        class="icon-menu activo"
                        id="abrir-menu"
                        src="/icons/menu-burger.png"
                        alt="Abrir menu"
                    >

                    <img
                        class="icon-menu"
                        id="fechar-menu"
                        src="/icons/close.png"
                        alt="Fechar menu"
                    >
                </button>

                <h1 class="logo">JOALHERIA</h1>
            </div>

            <div class="perfil-menu">
                <a
                    href="/frontend/pages/perfilVendedor.html"
                    class="perfil-btn"
                >
                    <img src="/icons/perfil.png" alt="Perfil">

                    <span
                        id="nome-usuario"
                        class="nome-usuario"
                    ></span>
                </a>
            </div>
        </nav>
    </header>

    <div class="mensagem-Erro"></div>

    <div class="menu">
        <div class="menu-vendedor">

            <a href="/frontend/pages/vendedor.html">
                <img src="/icons/inicio.png" alt="">
                <span>Início</span>
            </a>

            <a href="/frontend/pages/vendas.html">
                <img src="/icons/shopping-cart.png" alt="">
                <span>Vendas</span>
            </a>

            <a href="/frontend/pages/inventario.html">
                <img src="/icons/stock-rotation.png" alt="">
                <span>Inventário</span>
            </a>

            <a href="/frontend/pages/perfilVendedor.html">
                <img src="/icons/user.png" alt="">
                <span>Meu perfil</span>
            </a>

            <a href="/frontend/pages/inicial.html" class="sair">
                <img src="/icons/sair.png" id="logout"  alt="">
                <span>Sair</span>
            </a>

        </div>
    </div>

    <main class="inventario">

        <div class="cabecalho">
            <div>
                <h1>Inventário</h1>
                <p>Lista de produtos do seu departamento.</p>
            </div>

            <input
                type="search"
                id="pesquisa-produto"
                placeholder="Pesquisar produto..."
            >
        </div>

        <div class="produtos">

            <h2>Produtos em stock</h2>

            <div class="tabela-conteudo">
                <table>
                    <thead>
                        <tr>
                            <th>N.º</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td colspan="5" class="sem-dados">
                                A carregar produtos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </main>

    <footer>
        <div class="footer-bottom">
            <p>
                <span class="marca">
                    &copy; 2026 JOALHERIA UNIZAMBEZE
                </span>
                Todos os direitos reservados.
            </p>
        </div>
    </footer>

    <script src="/frontend/js/menu.js"></script>

    <script
        type="module"
        src="/frontend/js/usuarioCabecalho.js">
    </script>

    <script
        type="module"
        src="/frontend/js/inventario.js">
    </script>

</body>
</html>
