<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/css/global.css">
    <link rel="stylesheet" href="/frontend/css/login.css">
    <title>credenciar</title>
</head>
<body>
    <header>
        <nav>
            <div class="nav-esq">
                <img class="icon" src="/icons/menu-burger.png" alt="barra de menu">
                <h1 class="logo">JOALHERIA</h1>
            </div>
            <div class="nav-dir">
                <input type="search" name="pesquisa" id="pesquisa" placeholder="Pesquisar">
                <a href="#"><img  class="icon" src="/icons/user.png" alt="usuario"></a>
                <a href="#"><img class="icon" src="/icons/shopping-bag.png"  alt="carteira"></a>
                <a href="#"><img class="icon" src="/icons/shopping-cart.png" alt=""></a>
            </div>
        </nav>
    </header>
    <main>
        <div class="main-esq">
           <section class="form1-Login">
            <h2>ACESSE SUA CONTA</h2>
               <form class="login-form" action="">
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="guambe@gmail.com">
               
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="*********">
                <button type="button">Entrar</button>
               </form>
               <div class="links-form">
                   <a href=""><small>Esqueceu sua senha?</small></a>
                   <a href="">Ainda nao tem uma conta? <strong>Cadastrar</strong></a>
               </div>
           </section>
           <section class="form2-Login">
            <h2>CRIAR CONTA</h2>
            
               <form class="login-form" action="">
                
                <label for="email">Email:</label>
                <input type="email" name="email"  id="email" placeholder="guambe@gmail.com">
                
                <label for="nome">Nome Completo:</label>
                <input type="text" name="nome" id="nome" placeholder="Henquere condela">

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" placeholder="**********">
                <button type="button">Criar</button>
               </form>
               <div class="links-form">
                   <a href="">Ja tem uma Conta? <strong>Entrar</strong></a>
               </div>
           </section>
        </div>
        <div class="main-dir">
            <div class="amostra-credencial"></div>
        </div>
    </main>
    <footer>
       
    </footer>
</body>
</html>
